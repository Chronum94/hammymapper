[project]
name = "hammymapper"
version = "0.1.0"
description = "Maps LCAO Hamiltonian blocks to and from E(3)-equivariant irreps, exploiting Hamiltonian symmetries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "e3x>=1.0.2",
    "numpy>=2.3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
